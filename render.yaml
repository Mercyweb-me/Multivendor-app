services:
  - type: web
    name: backend
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn main.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /
databases:
  - name: postgres
    plan: free
