<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.6);
            border-top-color: white;
            border-radius: 9999px;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

</head>

<body class="bg-gray-100">

<!-- NAVBAR -->
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

        <h1 class="text-xl font-bold text-blue-600">
            MyTradingApp
        </h1>

        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-6">
            <a href="/" class="text-gray-700 hover:text-blue-600">Home</a>
            <a href="/register/" class="text-gray-700 hover:text-blue-600">Register</a>
        </div>

        <!-- Hamburger -->
        <button id="menu-btn" class="md:hidden text-gray-700 text-xl">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pb-4">
        <a href="/" class="block py-2 text-gray-700">Home</a>
        <a href="/register/" class="block py-2 text-gray-700">Register</a>
    </div>
</nav>


<!-- LOGIN SECTION -->
<div class="flex items-center justify-center min-h-screen px-4">

    <div class="bg-white shadow-lg rounded-xl w-full max-w-md p-8">

        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">
                Welcome Back
            </h2>
            <p class="text-gray-500 text-sm">
                Login to your account
            </p>
        </div>

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <!-- USERNAME -->
            <div class="mb-4">
                <label class="block text-gray-600 text-sm mb-2">
                    Username
                </label>

                <div class="flex items-center border rounded-lg px-3">
                    <i class="fa fa-user text-gray-400"></i>
                    <input type="text" name="username"
                        class="w-full p-2 outline-none"
                        placeholder="Enter username"
                        required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-6">
                <label class="block text-gray-600 text-sm mb-2">
                    Password
                </label>

                <div class="flex items-center border rounded-lg px-3">
                    <i class="fa fa-lock text-gray-400"></i>
                    <input type="password" name="password"
                        class="w-full p-2 outline-none"
                        placeholder="Enter password"
                        required>
                </div>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" id="loginSubmit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                <span class="btn-text">Login</span>
                <span id="loginSpinner" class="spinner hidden"></span>
            </button>

        </form>

        <!-- REGISTER LINK -->
        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account?
            <a href="/register/" class="text-blue-600 hover:underline">
                Register
            </a>
        </p>

    </div>

</div>


<!-- HAMBURGER SCRIPT -->
<script>
const btn = document.getElementById("menu-btn");
const menu = document.getElementById("mobile-menu");

btn.addEventListener("click", () => {
    menu.classList.toggle("hidden");
});

const loginForm = document.getElementById("loginForm");
const loginSubmit = document.getElementById("loginSubmit");
const loginSpinner = document.getElementById("loginSpinner");

if (loginForm) {
    loginForm.addEventListener("submit", () => {
        loginSubmit.disabled = true;
        loginSubmit.classList.add("opacity-80", "cursor-not-allowed");
        loginSpinner.classList.remove("hidden");
        loginSubmit.querySelector(".btn-text").textContent = "Logging in...";
    });
}
</script>

</body>
</html>
